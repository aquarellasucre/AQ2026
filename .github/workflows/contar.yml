name: Conteo de Archivos

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  ejecutar-conteo:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar el repositorio
      uses: actions/checkout@v4
      timeout-minutes: 2 # 👈 Si tarda más de 2 minutos se cancela solo

    - name: Dar permisos y ejecutar
      run: |
        chmod +x safe-count-files.sh
        ./safe-count-files.sh
