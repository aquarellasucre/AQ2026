name: Conteo de Archivos

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Te permite activarlo con un botón cuando quieras

jobs:
  ejecutar-conteo:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar el repositorio
      uses: actions/checkout@v4

    - name: Dar permisos y ejecutar
      run: |
        chmod +x safe-count-files.sh
        ./safe-count-files.sh
